name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          # ubuntu-latest 自带 Android SDK，只补装本项目需要的组件。
          # 不用 android-actions/setup-android@v3：它会尝试安装已废弃的 "tools" 包而失败。
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          echo "=== platforms ==="
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/padmouse-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: padmouse-apk
          path: out/*.apk
          retention-days: 90

      - name: Upload mapping (if any)
        if: hashFiles('app/build/outputs/mapping/debug/mapping.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping/debug/mapping.txt
          retention-days: 30

      # 打 tag（v*）时自动发布 Release，APK 出现在仓库首页的 Releases 里，
      # 无需登录即可直接下载。普通 main 分支构建只上传 Artifacts（90 天有效）。
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
